        // 聚合数据
        function buildCityData() {
            const map = new Map();
            function addRecord(city, time, type, event, country) {
                if (!map.has(city)) map.set(city, { name: city, records: [] });
                const entry = map.get(city);
                if (!entry.records.some(r => r.time === time && r.type === type))
                    entry.records.push({ time, type, event: event || '', country: country || '' });
            }
            HISTORIC.forEach(h => addRecord(h.city, h.time, h.treaty, h.war, h.country));
            MODERN.forEach(m => addRecord(m.city, m.time, m.type, '', ''));
            const result = [];
            for (const [city, data] of map) {
                data.records.sort((a, b) => a.time - b.time);
                if (COORDS[city]) { data.coords = COORDS[city]; result.push(data); }
            }
            return result;
        }

            if (time === 1842) return '1842';
            if (time === 1858) return '1858';
            if (time === 1860) return '1860';

            if (time === 1890 || time === 1895) return '1890';

            if (time === 1984) return '1984';
            if (time >= 1985 && time <= 1992) return '1985';
            if (time >= 2010) return '2010';
            return 'other';

            return L.divIcon({
                className: 'custom-pin',
                html: `<svg viewBox="0 0 24 36" width="24" height="36" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12z" fill="${color}" stroke="#ffffff" stroke-width="2"/>
                        <circle cx="12" cy="12" r="4" fill="#ffffff"/>
                       </svg>`,
                iconSize: [24, 36],
                iconAnchor: [12, 36],
                popupAnchor: [0, -36]
            });
        }

        // ============================================================
        // 3. 地图初始化（天地图）
        // ============================================================
        const map = L.map('map', {
            center: [35.0, 108.0],
            zoom: 4.5,
            minZoom: 2,
            zoomControl: true
        });

        const TK = '210fc34860fb5a20dc04440711aa94a6';  // 你的密钥

        L.tileLayer('https://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=' + TK, {
            subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
            maxZoom: 18,
            minZoom: 2,
            attribution: '© 天地图'
        }).addTo(map);

        L.tileLayer('https://t{s}.tianditu.gov.cn/cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=' + TK, {
            subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
            maxZoom: 18,
            minZoom: 2,
            attribution: '© 天地图'
        }).addTo(map);

        // ============================================================
        // 4. 标记管理
        // ============================================================
        let markersLayer = L.layerGroup().addTo(map);
        let allMarkers = [];

        function getLatestRecord(records) { return records.reduce((a, b) => a.time > b.time ? a : b); }

        function buildPopupContent(city) {
            let html = `<div class="popup-city">📍 ${city.name}</div>`;
            city.records.sort((a, b) => a.time - b.time).forEach(r => {
                const color = getColorByTime(r.time);
                let detail = (r.event ? ' ' + r.event : '') + (r.country ? ' · ' + r.country : '');
                html += `<div class="popup-record">
                            <span class="badge" style="background:${color};">${r.time}</span>
                            <span><strong>${r.type}</strong></span>
                            <span class="detail">${detail}</span>
                        </div>`;
            });
            return html;
        }

        function buildMarkers() {
            markersLayer.clearLayers();
            allMarkers = [];
            cityData.forEach(city => {
                const latest = getLatestRecord(city.records);
                const color = getColorByTime(latest.time);
                const marker = L.marker(city.coords, {
                    icon: createPinIcon(color)
                });
                marker.bindPopup(buildPopupContent(city), { className: 'custom-popup', maxWidth: 320 });
                marker._cityData = city;
                marker._latestTime = latest.time;
                marker._periodKey = getPeriodKey(latest.time);
                markersLayer.addLayer(marker);
                allMarkers.push({ marker, city: city.name, records: city.records, latestTime: latest.time, periodKey: getPeriodKey(latest.time) });
            });
            updateStats('all');
        }

        // ============================================================
        // 5. 动态筛选 + 变色
        // ============================================================
        function filterMarkers(filterKey) {
            let visible = 0;
            allMarkers.forEach(item => {
                const marker = item.marker;
                let show = false;
                let color = '#64748b';

                if (filterKey === 'all') {
                    show = true;
                    const latest = getLatestRecord(item.records);
                    color = getColorByTime(latest.time);
                } else if (filterKey === 'historical') {
                    const hasHistorical = item.records.some(r => r.time >= 1842 && r.time <= 1895);
                    if (hasHistorical) { show = true;
                        color = '#b91c1c'; }
                } else if (filterKey === 'modern') {
                    const hasModern = item.records.some(r => r.time >= 1980 && r.time <= 2019);
                    if (hasModern) { show = true;
                        color = '#2563eb'; }
                } else {
                    const matchedRecord = item.records.find(r => getPeriodKey(r.time) === filterKey);
                    if (matchedRecord) { show = true;
                        color = getColorByPeriodKey(filterKey); }
                }

                if (show) {
                    marker.setIcon(createPinIcon(color));
                    markersLayer.addLayer(marker);
                    visible++;
                } else {
                    markersLayer.removeLayer(marker);
                }
            });
            updateStats(filterKey, visible);
        }

        function updateStats(filterKey, count) {
            document.getElementById('count-display').textContent = count;
            const labels = {
                'all': '全部时期',
                'historical': '近代 (1842-1895)',
                'modern': '现代 (1980-2019)',
                '1842': '1842 南京条约',
                '1858': '1858 天津条约',
                '1860': '1860 北京条约',
                '1876': '1876 烟台条约',
                '1890': '1890·马关条约',
                '1980': '1980 经济特区',
                '1984': '1984 沿海开放城市',
                '1985': '1985 沿海经济开放区',
                '2010': '2010+ 自贸区/港'
            };
            document.getElementById('period-display').textContent = labels[filterKey] || '全部时期';
        }

        // 绑定筛选按钮
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                filterMarkers(this.dataset.filter);
            });
        });

        map.on('click', () => map.closePopup());

        // 启动
        buildMarkers();
        filterMarkers('all');
        setTimeout(() => map.invalidateSize(), 300);
        window.addEventListener('resize', () => map.invalidateSize());
        console.log('✅ 图钉版地图加载完成');
    </script>
</body>
</html>
